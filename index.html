<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kranky Starting 11 Studio</title>
  <style>
    :root {
      --bg-app: #07090d;
      --bg-panel: #0e1218;
      --bg-input: #151b24;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --kit-primary: #facc15;
      --kit-text: #090d16;
      --gk-primary: #38bdf8;
      --accent-color: #facc15;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* --- TOP STUDIO BAR --- */
    .studio-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #0a0d12;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sync-status {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-right: 4px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-green {
      background: #16a34a;
      color: white;
    }

    .btn-green:hover {
      background: #15803d;
    }

    .btn-ghost {
      background: #1e293b;
      color: #cbd5e1;
    }

    .btn-ghost:hover {
      background: #334155;
    }

    /* --- MAIN LAYOUT --- */
    .workspace {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* --- 1ST LOOK: SLEEK MATTE-CHARCOAL BROADCAST CARD --- */
    .broadcast-card {
      width: 440px;
      background: #121417;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .graphic-header {
      padding: 16px 20px;
      background: #16181d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .team-badge {
      padding: 4px 8px;
      min-width: 38px;
      height: 26px;
      border-radius: 5px;
      background: var(--kit-primary);
      color: var(--kit-text);
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }

    .team-meta .team-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.1;
    }

    .header-right {
      text-align: right;
    }

    .header-right .formation-readout {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    /* --- CLEAN DARK PITCH (NO GREEN TINT) --- */
    .pitch-wrapper {
      padding: 14px 16px 10px;
      background: #121417;
    }

    .pitch {
      position: relative;
      width: 100%;
      height: 530px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      overflow: hidden;
      background: repeating-linear-gradient(
        to bottom,
        #16181c 0px,
        #16181c 53px,
        #1b1e23 53px,
        #1b1e23 106px
      );
    }

    .pitch-line-half {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.09);
    }

    .pitch-circle-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96px;
      height: 96px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .pitch-box-top {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 185px;
      height: 64px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-top: none;
    }

    .pitch-box-bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 185px;
      height: 64px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-bottom: none;
    }

    /* --- PLAYER TOKENS (1ST LOOK) --- */
    .player-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .jersey-token {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 32% 28%,
        color-mix(in srgb, var(--token-bg, var(--kit-primary)) 75%, #ffffff) 0%,
        var(--token-bg, var(--kit-primary)) 68%,
        color-mix(in srgb, var(--token-bg, var(--kit-primary)) 75%, #000000) 100%
      );
      color: var(--token-fg, var(--kit-text));
      font-weight: 900;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.65);
    }

    .pos-pill {
      display: none;
      margin-top: -5px;
      margin-bottom: 2px;
      padding: 1px 5px;
      font-size: 8px;
      font-weight: 800;
      background: #0d0f12;
      color: var(--accent-color);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    .pitch.show-pos .pos-pill {
      display: inline-block;
    }

    /* SLEEK COMPACT NAMEPLATE (NO LEFT ACCENT BAR) */
    .name-plate {
      margin-top: 6px;
      padding: 3px 9px;
      background: rgba(11, 13, 16, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.7px;
      color: #f8fafc;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.65);
    }

    .graphic-footer {
      padding: 10px 18px 12px;
      background: #121417;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    /* --- STUDIO CONTROLS PANEL --- */
    .controls-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 18px;
    }

    .panel-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-color);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .color-box {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .color-box span {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 9px 11px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    input::placeholder {
      color: #64748b;
    }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .preset-btn {
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 5px;
      border: 1px solid var(--border-subtle);
      background: #161f2c;
      color: white;
      cursor: pointer;
    }

    .preset-btn:hover {
      background: #233044;
    }

    .player-inputs-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-input-row {
      display: grid;
      grid-template-columns: 50px 38px 60px 1fr;
      gap: 8px;
      align-items: center;
    }

    .pos-tag-static {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-color);
      text-align: center;
      background: #141c26;
      padding: 9px 4px;
      border-radius: 5px;
    }

    .player-color-picker {
      height: 34px !important;
      width: 38px !important;
    }

    .num-input {
      text-align: center;
      border-color: rgba(250, 204, 21, 0.25) !important;
    }

    /* --- OBS CLEAN MODE (?obs=1) --- */
    body.obs-mode {
      background: transparent !important;
      overflow: hidden;
    }
    body.obs-mode .studio-topbar,
    body.obs-mode .controls-column {
      display: none !important;
    }
    body.obs-mode .workspace {
      padding: 0;
      margin: 0;
      display: block;
    }
    body.obs-mode .broadcast-card {
      box-shadow: none;
    }
  </style>
</head>
<body>

  <header class="studio-topbar">
    <div class="brand-title">
      <span class="live-dot"></span>
      <span>Kranky Starting 11 Studio</span>
    </div>
    <div class="topbar-actions">
      <span class="sync-status" id="syncStatusText">Ready</span>
      <button class="btn btn-green" onclick="pushCloudSync()">Sync to OBS</button>
      <button class="btn btn-primary" onclick="copyObsUrl()">Copy Fixed OBS URL</button>
    </div>
  </header>

  <main class="workspace">
    <!-- LEFT: BROADCAST GRAPHIC (1ST LOOK) -->

      <div class="graphic-header">
        <div class="header-left">
          <div class="team-badge" id="badgeText">JAM</div>
          <div class="team-meta">
            <div class="team-title" id="displayTeamName">JAMAICA XI</div>
          </div>
        </div>
        <div class="header-right">
          <div class="formation-readout" id="displayFormation">4-3-3 ATTACKING</div>
        </div>
      </div>

      <div class="pitch-wrapper">
        <div class="pitch" id="pitchCanvas">
          <div class="pitch-line-half"></div>
          <div class="pitch-circle-center"></div>
          <div class="pitch-box-top"></div>
          <div class="pitch-box-bottom"></div>
          <div id="playersLayer"></div>
        </div>
      </div>

      <div class="graphic-footer">
        <span id="footerLeft">KRANKY LIVE MATCHDAY</span>
        <span id="footerRight">PRE-MATCH SHOW</span>
      </div>
    </section>

    <!-- RIGHT: STUDIO CONTROLS -->
    <section class="controls-column">
      <div class="panel-card">
        <div class="panel-header-row">
          <div class="panel-title">1. Formation &amp; Broadcast Style</div>
        </div>
        <div class="grid-2">
          <div>
            <label>Tactical Formation</label>
            <select id="formationSelect" onchange="handleFormationChange()">
              <option value="4-3-3">4-3-3 (Attacking)</option>
              <option value="4-2-3-1">4-2-3-1 (Balanced)</option>
              <option value="3-4-3">3-4-3 (Wide Wingbacks)</option>
              <option value="3-5-2">3-5-2 (Midfield Control)</option>
              <option value="4-4-2">4-4-2 (Classic)</option>
              <option value="5-3-2">5-3-2 (Low Block / Counter)</option>
              <option value="4-1-4-1">4-1-4-1 (Holding Pivot)</option>
              <option value="4-3-2-1">4-3-2-1 (Christmas Tree)</option>
            </select>
          </div>
          <div style="display:flex; align-items:flex-end; padding-bottom:6px;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:#e2e8f0;">
              <input type="checkbox" id="togglePosCheck" onchange="togglePositions()" />
              Show CB / RB Tags on Pitch
            </label>
          </div>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-header-row">
          <div class="panel-title">2. Team Identity &amp; Global Kit Theme</div>
        </div>
        <div class="grid-2">
          <div>
            <label>Club / National Team Name</label>
            <input type="text" id="teamNameInput" value="JAMAICA XI" oninput="renderPitch()" />
          </div>
          <div>
            <label>Badge Tag (3 Letters)</label>
            <input type="text" id="badgeInput" value="JAM" maxlength="4" oninput="renderPitch()" />
          </div>
        </div>

        <div class="grid-2" style="margin-top: 10px;">
          <div>
            <label>Footer Left Text</label>
            <input type="text" id="footerLeftInput" value="KRANKY LIVE MATCHDAY" oninput="renderPitch()" />
          </div>
          <div>
            <label>Footer Right Text</label>
            <input type="text" id="footerRightInput" value="PRE-MATCH SHOW" oninput="renderPitch()" />
          </div>
        </div>

        <div class="color-grid">
          <div class="color-box">
            <span>All Outfield</span>
            <input type="color" id="kitColorPicker" value="#facc15" oninput="updateGlobalColors()" />
          </div>
          <div class="color-box">
            <span>Number Text</span>
            <input type="color" id="kitTextPicker" value="#090d16" oninput="updateGlobalColors()" />
          </div>
          <div class="color-box">
            <span>GK Default</span>
            <input type="color" id="gkColorPicker" value="#facc15" oninput="updateGlobalColors()" />
          </div>
          <div class="color-box">
            <span>Formation Accent</span>
            <input type="color" id="accentColorPicker" value="#facc15" oninput="updateGlobalColors()" />
          </div>
        </div>

        <div class="preset-row">
          <button class="preset-btn" onclick="applyPreset('#facc15', '#090d16', '#facc15', '#facc15')">Jamaica All-Gold</button>
          <button class="preset-btn" onclick="applyPreset('#facc15', '#090d16', '#38bdf8', '#facc15')">Jamaica Gold / Sky GK</button>
          <button class="preset-btn" onclick="applyPreset('#ef4444', '#ffffff', '#38bdf8', '#ef4444')">Arsenal Red / White</button>
          <button class="preset-btn" onclick="applyPreset('#38bdf8', '#090d16', '#f97316', '#38bdf8')">Sky Blue / Orange GK</button>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-header-row">
          <div class="panel-title">3. Starting 11 (Click Any Swatch to Change That Player's Color)</div>
          <button class="btn btn-ghost" onclick="clearNumbers()">Clear Numbers</button>
        </div>
        <div class="player-inputs-list" id="playerInputsContainer"></div>
      </div>
    </section>
  </main>

      { num: "4", name: "Leigh", color: "#facc15" },
      { num: "5", name: "Pinnock", color: "#facc15" },
      { num: "6", name: "Lowe", color: "#facc15" },
      { num: "2", name: "Lembikisa", color: "#facc15" },
      { num: "10", name: "De Cordova-Reid", color: "#facc15" },
      { num: "8", name: "Latibeaudiere", color: "#facc15" },
      { num: "15", name: "Palmer", color: "#facc15" },
      { num: "7", name: "Bailey", color: "#facc15" },
      { num: "9", name: "Antonio", color: "#facc15" },
      { num: "11", name: "Nicholson", color: "#facc15" }
    ];

    function getContrastText(hex) {
      const clean = (hex || "#facc15").replace("#", "");
      if (clean.length !== 6) return "#090d16";
      const r = parseInt(clean.substr(0, 2), 16);
      const g = parseInt(clean.substr(2, 2), 16);
      const b = parseInt(clean.substr(4, 2), 16);
      const yiq = (r * 299 + g * 587 + b * 114) / 1000;
      return yiq >= 145 ? "#090d16" : "#ffffff";
    }

    function applyColorVars(colors) {
      currentColors = colors;
      document.documentElement.style.setProperty("--kit-primary", colors.primary);
      document.documentElement.style.setProperty("--kit-text", colors.text);
      document.documentElement.style.setProperty("--gk-primary", colors.gk);
      document.documentElement.style.setProperty("--accent-color", colors.accent || colors.primary);

      document.getElementById("kitColorPicker").value = colors.primary;
      document.getElementById("kitTextPicker").value = colors.text;
      document.getElementById("gkColorPicker").value = colors.gk;
      document.getElementById("accentColorPicker").value = colors.accent || colors.primary;
    }

    function updateGlobalColors() {
      const primary = document.getElementById("kitColorPicker").value;
      const text = document.getElementById("kitTextPicker").value;
      const gk = document.getElementById("gkColorPicker").value;
      const accent = document.getElementById("accentColorPicker").value;

      applyColorVars({ primary, text, gk, accent });

      squad.forEach((p, idx) => {
        p.color = idx === 0 ? gk : primary;
      });

      buildInputs();
      renderPitch();
    }

    function applyPreset(primary, text, gk, accent) {
      applyColorVars({ primary, text, gk, accent });
      squad.forEach((p, idx) => {
        p.color = idx === 0 ? gk : primary;
      });
      buildInputs();
      renderPitch();
    }

    function buildInputs() {
      const container = document.getElementById("playerInputsContainer");
      const formation = FORMATIONS[document.getElementById("formationSelect").value];
      container.innerHTML = "";

      squad.forEach((player, idx) => {
        const fallbackColor = idx === 0 ? currentColors.gk : currentColors.primary;
        const playerColor = player.color || fallbackColor;

        const row = document.createElement("div");
        row.className = "player-input-row";
        row.innerHTML = `
          <div class="pos-tag-static">${formation[idx].pos}</div>
          <input
            type="color"
            class="player-color-picker"
            title="Change this player's circle color"
            value="${playerColor}"
            oninput="updatePlayer(${idx}, 'color', this.value)"
          />
          <input
            type="text"
            class="num-input"
            placeholder="#"
            maxlength="3"
            value="${player.num}"
            oninput="updatePlayer(${idx}, 'num', this.value)"
          />
          <input
            type="text"
            placeholder="Player Name"
            value="${player.name}"
            oninput="updatePlayer(${idx}, 'name', this.value)"
          />
        `;
        container.appendChild(row);
      });
    }

    function updatePlayer(index, field, value) {
      squad[index][field] = value;
      renderPitch();
    }

    function clearNumbers() {
      squad.forEach((p) => (p.num = ""));
      buildInputs();
      renderPitch();
    }

    function handleFormationChange() {
      buildInputs();
      renderPitch();
    }

    function togglePositions() {
      const show = document.getElementById("togglePosCheck").checked;
      document.getElementById("pitchCanvas").classList.toggle("show-pos", show);
      saveLocal();
    }

    function renderPitch() {
      const formationKey = document.getElementById("formationSelect").value;
      const coords = FORMATIONS[formationKey];
      const layer = document.getElementById("playersLayer");

      document.getElementById("displayTeamName").textContent =
        document.getElementById("teamNameInput").value || "TEAM LINEUP";
      document.getElementById("badgeText").textContent =
        document.getElementById("badgeInput").value || "XI";
      document.getElementById("displayFormation").textContent =
        FORMATION_LABELS[formationKey] || formationKey;
      document.getElementById("footerLeft").textContent =
        document.getElementById("footerLeftInput").value || "";
      document.getElementById("footerRight").textContent =
        document.getElementById("footerRightInput").value || "";

      layer.innerHTML = "";

      squad.forEach((player, i) => {
        const spot = coords[i];
        const node = document.createElement("div");
        node.className = "player-node";
        node.style.left = `${spot.x}%`;
        node.style.top = `${spot.y}%`;

        const displayNum = player.num ? player.num.trim() : "";
        const fallbackColor = i === 0 ? currentColors.gk : currentColors.primary;
        const tokenBg = player.color || fallbackColor;
        const tokenFg = i === 0 ? getContrastText(tokenBg) : currentColors.text;

        node.innerHTML = `
          <div class="jersey-token" style="--token-bg:${tokenBg}; --token-fg:${tokenFg};">${displayNum}</div>
          <div class="pos-pill">${spot.pos}</div>
          <div class="name-plate">${player.name}</div>
        `;
        layer.appendChild(node);
      });

      saveLocal();
    }

    function getStateObject() {
      return {
        team: document.getElementById("teamNameInput").value,
        badge: document.getElementById("badgeInput").value,
        footerLeft: document.getElementById("footerLeftInput").value,
        footerRight: document.getElementById("footerRightInput").value,
        formation: document.getElementById("formationSelect").value,
        showPos: document.getElementById("togglePosCheck").checked,
        colors: currentColors,
        squad
      };
    }

    function applyStateObject(parsed) {
      if (!parsed) return;
      if (parsed.team !== undefined) document.getElementById("teamNameInput").value = parsed.team;
      if (parsed.badge !== undefined) document.getElementById("badgeInput").value = parsed.badge;
      if (parsed.footerLeft !== undefined) document.getElementById("footerLeftInput").value = parsed.footerLeft;
      if (parsed.footerRight !== undefined) document.getElementById("footerRightInput").value = parsed.footerRight;
      if (parsed.formation && FORMATIONS[parsed.formation]) {
        document.getElementById("formationSelect").value = parsed.formation;
      }
      if (typeof parsed.showPos === "boolean") {
        document.getElementById("togglePosCheck").checked = parsed.showPos;
        document.getElementById("pitchCanvas").classList.toggle("show-pos", parsed.showPos);
      }
      if (parsed.colors) {
        applyColorVars(parsed.colors);
      }
      if (Array.isArray(parsed.squad) && parsed.squad.length === 11) {
        squad = parsed.squad;
      }
    }

    function saveLocal() {
      localStorage.setItem("kranky_starting_11_v6", JSON.stringify(getStateObject()));
    }

    async function pushCloudSync() {
      const statusEl = document.getElementById("syncStatusText");
      statusEl.textContent = "Syncing...";
      statusEl.style.color = "#eab308";
      try {
        await fetch(`https://ntfy.sh/${SYNC_CHANNEL}`, {
          method: "POST",
          body: JSON.stringify(getStateObject())
        });
        statusEl.textContent = "Synced! Hit Refresh in OBS";
        statusEl.style.color = "#22c55e";
      } catch (e) {
        statusEl.textContent = "Sync failed";
        statusEl.style.color = "#ef4444";
      }
    }

    async function pullCloudSync() {
      try {
        const res = await fetch(`https://ntfy.sh/${SYNC_CHANNEL}/json?poll=1&since=24h`, {
          cache: "no-store"
        });
        const text = await res.text();
        const lines = text.trim().split("\n").filter(Boolean);
        if (lines.length > 0) {
          const lastEvent = JSON.parse(lines[lines.length - 1]);
          if (lastEvent && lastEvent.message) {
            const state = JSON.parse(lastEvent.message);
            applyStateObject(state);
            buildInputs();
            renderPitch();
          }
        }
      } catch (e) {}
    }

    async function initApp() {
      const params = new URLSearchParams(window.location.search);
      const isObs = params.get("obs") === "1";

      if (isObs) {
        document.body.classList.add("obs-mode");
      }

      const saved = localStorage.getItem("kranky_starting_11_v6");
      if (saved) {
        try {
          applyStateObject(JSON.parse(saved));
        } catch (e) {}
      }

      buildInputs();
      renderPitch();

      if (isObs) {
        await pullCloudSync();
      }
    }

    function copyObsUrl() {
      const fixedUrl = `${window.location.origin}${window.location.pathname}?obs=1`;
      navigator.clipboard.writeText(fixedUrl);
      alert("Copied Fixed OBS URL:\n" + fixedUrl + "\n\nYour OBS URL is already set—just click 'Sync to OBS' here and hit 'Refresh' in OBS!");
    }

    initApp();
  </script>
</body>
</html>
