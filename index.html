<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kranky Starting 11 Studio</title>
  <style>
    :root {
      --bg-app: #070b10;
      --bg-panel: #0d131a;
      --bg-input: #141c26;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --kit-primary: #eab308;
      --kit-text: #090d16;
      --gk-primary: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* --- TOP STUDIO BAR --- */
    .studio-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #0a0f16;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-green {
      background: #16a34a;
      color: white;
    }

    /* --- MAIN LAYOUT --- */
    .workspace {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* --- BROADCAST GRAPHIC CARD (What OBS Captures) --- */
    .broadcast-card {
      width: 440px;
      background: #090d14;
      border-radius: 12px;
      border: 1px solid rgba(234, 179, 8, 0.3);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .graphic-header {
      position: relative;
      padding: 14px 18px 14px 22px;
      background: linear-gradient(135deg, #0b1219 0%, #101c17 100%);
      border-bottom: 2px solid var(--kit-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .graphic-header::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(
        to bottom,
        #16a34a 0%, #16a34a 33.3%,
        #eab308 33.3%, #eab308 66.6%,
        #090d14 66.6%, #090d14 100%
      );
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-badge {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(145deg, var(--kit-primary), #ca8a04);
      color: var(--kit-text);
      font-weight: 900;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .team-meta .eyebrow {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--kit-primary);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .team-meta .team-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.1;
    }

    .header-right {
      text-align: right;
    }

    .header-right .tactical-label {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .header-right .formation-readout {
      font-size: 11px;
      font-weight: 800;
      color: #e2e8f0;
      margin-top: 2px;
    }

    /* --- STADIUM PITCH --- */
    .pitch-wrapper {
      padding: 14px;
      background: #080c12;
    }

    .pitch {
      position: relative;
      width: 100%;
      height: 540px;
      border-radius: 8px;
      border: 1.5px solid rgba(234, 179, 8, 0.45);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(22, 163, 74, 0.22) 0%, rgba(8, 13, 18, 0.92) 78%),
        repeating-linear-gradient(
          to bottom,
          #0c1813 0px,
          #0c1813 45px,
          #10211a 45px,
          #10211a 90px
        );
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.85);
    }

    .pitch-line-half {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.14);
    }

    .pitch-circle-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96px;
      height: 96px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .pitch-box-top {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: 68px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: none;
    }

    .pitch-box-bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: 68px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: none;
    }

    /* --- PLAYER TOKENS --- */
    .player-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .jersey-token {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fef08a 0%, var(--kit-primary) 65%, #a16207 100%);
      color: var(--kit-text);
      font-weight: 900;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #090d14;
      box-shadow:
        0 0 0 2px rgba(234, 179, 8, 0.55),
        0 8px 16px rgba(0, 0, 0, 0.85);
    }

    .jersey-token.gk {
      background: radial-gradient(circle at 30% 25%, #6ee7b7 0%, var(--gk-primary) 65%, #065f46 100%);
      color: #ffffff;
      box-shadow:
        0 0 0 2px rgba(16, 185, 129, 0.55),
        0 8px 16px rgba(0, 0, 0, 0.85);
    }

    .pos-pill {
      display: none;
      margin-top: -6px;
      margin-bottom: 2px;
      padding: 1px 5px;
      font-size: 8px;
      font-weight: 800;
      background: #090d14;
      color: var(--kit-primary);
      border: 1px solid rgba(234, 179, 8, 0.4);
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    .pitch.show-pos .pos-pill {
      display: inline-block;
    }

    .name-plate {
      margin-top: 5px;
      padding: 3px 8px;
      background: rgba(9, 13, 20, 0.92);
      border-left: 3px solid var(--kit-primary);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #ffffff;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
    }

    .graphic-footer {
      padding: 8px 16px;
      background: #070a10;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
    }

    /* --- STUDIO CONTROLS PANEL --- */
    .controls-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 18px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--kit-primary);
      margin-bottom: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 9px 11px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    .preset-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .preset-btn {
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 5px;
      border: 1px solid var(--border-subtle);
      background: #161f2c;
      color: white;
      cursor: pointer;
    }

    .player-inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .player-input-row {
      display: grid;
      grid-template-columns: 44px 48px 1fr;
      gap: 6px;
      align-items: center;
    }

    .pos-tag-static {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      text-align: center;
      background: #141c26;
      padding: 8px 4px;
      border-radius: 5px;
    }

    /* --- OBS CLEAN MODE (?obs=1) --- */
    body.obs-mode {
      background: transparent !important;
      overflow: hidden;
    }
    body.obs-mode .studio-topbar,
    body.obs-mode .controls-column {
      display: none !important;
    }
    body.obs-mode .workspace {
      padding: 0;
      margin: 0;
      display: block;
    }
    body.obs-mode .broadcast-card {
      box-shadow: none;
    }
  </style>
</head>
<body>

  <header class="studio-topbar">
    <div class="brand-title">
      <span class="live-dot"></span>
      <span>Kranky Starting 11 Studio</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="copyObsUrl()">Copy OBS Overlay URL</button>
      <button class="btn btn-green" onclick="renderPitch()">Force Sync</button>
    </div>
  </header>

  <main class="workspace">
    <!-- LEFT: BROADCAST GRAPHIC -->
    <section class="broadcast-card" id="broadcastGraphic">
      <div class="graphic-header">
        <div class="header-left">
          <div class="team-badge" id="badgeText">JR</div>
          <div class="team-meta">
            <div class="eyebrow">Starting Lineup</div>
            <div class="team-title" id="displayTeamName">JAMAICA REGGAE BOYZ</div>
          </div>
        </div>
        <div class="header-right">
          <div class="tactical-label">Tactical Breakdown</div>
          <div class="formation-readout" id="displayFormation">4-2-3-1 • STARTING XI</div>
        </div>
      </div>

      <div class="pitch-wrapper">
        <div class="pitch" id="pitchCanvas">
          <div class="pitch-line-half"></div>
          <div class="pitch-circle-center"></div>
          <div class="pitch-box-top"></div>
          <div class="pitch-box-bottom"></div>
          <div id="playersLayer"></div>
        </div>
      </div>

      <div class="graphic-footer">
        <span>REGGAE BOYZ MATCHDAY</span>
        <span>KRANKY LIVE BROADCAST</span>
      </div>
    </section>

    <!-- RIGHT: STUDIO CONTROLS -->
    <section class="controls-column">
      <div class="panel-card">
        <div class="panel-title">1. Formation & Broadcast Style</div>
        <div class="grid-2">
          <div>
            <label>Tactical Formation</label>
            <select id="formationSelect" onchange="handleFormationChange()">
              <option value="4-2-3-1">4-2-3-1 (Balanced)</option>
              <option value="4-3-3">4-3-3 (Attacking)</option>
              <option value="3-4-3">3-4-3 (Wide Wingbacks)</option>
              <option value="3-5-2">3-5-2 (Midfield Control)</option>
              <option value="4-4-2">4-4-2 (Classic)</option>
              <option value="5-3-2">5-3-2 (Low Block / Counter)</option>
              <option value="4-1-4-1">4-1-4-1 (Holding Pivot)</option>
              <option value="4-3-2-1">4-3-2-1 (Christmas Tree)</option>
            </select>
          </div>
          <div style="display:flex; align-items:flex-end; padding-bottom:6px;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:#e2e8f0;">
              <input type="checkbox" id="togglePosCheck" onchange="togglePositions()" />
              Show CB / RB Tags on Pitch
            </label>
          </div>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-title">2. Team Identity & Kit Theme</div>
        <div class="grid-2">
          <div>
            <label>Club / National Team Name</label>
            <input type="text" id="teamNameInput" value="JAMAICA REGGAE BOYZ" oninput="renderPitch()" />
          </div>
          <div>
            <label>Badge Initials</label>
            <input type="text" id="badgeInput" value="JR" maxlength="3" oninput="renderPitch()" />
          </div>
        </div>
        <div class="preset-row">
          <button class="preset-btn" onclick="applyPreset('#eab308', '#090d16', '#10b981')">Jamaica Gold / Green</button>
          <button class="preset-btn" onclick="applyPreset('#ef4444', '#ffffff', '#0ea5e9')">Arsenal Red / White</button>
          <button class="preset-btn" onclick="applyPreset('#38bdf8', '#090d16', '#f59e0b')">City Sky Blue</button>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-title">3. Starting 11 Players (Number & Name)</div>
        <div class="player-inputs-grid" id="playerInputsContainer"></div>
      </div>
    </section>
  </main>

    let currentColors = {
      primary: "#eab308",
      text: "#090d16",
      gk: "#10b981"
    };

    let squad = [
      { num: "1", name: "Blake" },
      { num: "4", name: "Leigh" },
      { num: "5", name: "Pinnock" },
      { num: "6", name: "Lowe" },
      { num: "2", name: "Lembikisa" },
      { num: "15", name: "Palmer" },
      { num: "8", name: "Latibeaudiere" },
      { num: "7", name: "Bailey" },
      { num: "10", name: "De Cordova-Reid" },
      { num: "11", name: "Nicholson" },
      { num: "9", name: "Antonio" }
    ];

    function buildInputs() {
      const container = document.getElementById("playerInputsContainer");
      const formation = FORMATIONS[document.getElementById("formationSelect").value];
      container.innerHTML = "";

      squad.forEach((player, idx) => {
        const row = document.createElement("div");
        row.className = "player-input-row";
        row.innerHTML = `
          <div class="pos-tag-static">${formation[idx].pos}</div>
          <input type="text" value="${player.num}" oninput="updatePlayer(${idx}, 'num', this.value)" />
          <input type="text" value="${player.name}" oninput="updatePlayer(${idx}, 'name', this.value)" />
        `;
        container.appendChild(row);
      });
    }

    function updatePlayer(index, field, value) {
      squad[index][field] = value;
      renderPitch();
    }

    function handleFormationChange() {
      buildInputs();
      renderPitch();
    }

    function togglePositions() {
      const show = document.getElementById("togglePosCheck").checked;
      document.getElementById("pitchCanvas").classList.toggle("show-pos", show);
    }

    function applyPreset(primary, text, gk) {
      currentColors = { primary, text, gk };
      document.documentElement.style.setProperty("--kit-primary", primary);
      document.documentElement.style.setProperty("--kit-text", text);
      document.documentElement.style.setProperty("--gk-primary", gk);
      saveState();
    }

    function renderPitch() {
      const formationKey = document.getElementById("formationSelect").value;
      const coords = FORMATIONS[formationKey];
      const layer = document.getElementById("playersLayer");

      document.getElementById("displayTeamName").textContent =
        document.getElementById("teamNameInput").value || "TEAM LINEUP";
      document.getElementById("badgeText").textContent =
        document.getElementById("badgeInput").value || "XI";
      document.getElementById("displayFormation").text
